name: Build solfire

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t solfire-solve .

      - name: Run build
        run: docker run --rm -v "$PWD:/work" solfire-solve

      - name: Find solve.so
        run: |
          echo "Searching for solve.so..."
          find . -name "solve.so" -type f -print

      - name: Upload solve.so
        uses: actions/upload-artifact@v4
        with:
          name: solve-so
          path: |
            **/solve.so
