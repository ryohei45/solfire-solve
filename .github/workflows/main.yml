name: Build solfire

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t solfire-solve .

      - name: Build solve.so
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            solfire-solve

      - name: Verify solve.so
        run: |
          ls -lh dist/solve/solve.so
          file dist/solve/solve.so

      - name: Upload solve.so
        uses: actions/upload-artifact@v4
        with:
          name: solve-so
          path: dist/solve/solve.so
